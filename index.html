const _b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function _deriveKey(pass, saltU8, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:saltU8, iterations:iter, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
}
async function _gunzip(buf){
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).text();
}
let _sblocco=false;
async function sblocca(){
  if(_sblocco) return; _sblocco=true;
  const pw=document.getElementById("pw"), err=document.getElementById("pwerr");
  err.textContent="verifico…";
  try{
    const key=await _deriveKey(pw.value, _b64u8(SALT), ITER);
    const pt=await crypto.subtle.decrypt({ name:"AES-GCM", iv:_b64u8(IV) }, key, _b64u8(BLOB));  // il tag GCM lancia se la password è errata
    const p=JSON.parse(await _gunzip(pt));
    const st=document.createElement("style"); st.textContent=p.css; document.head.appendChild(st);
    const c=document.createElement("div"); c.innerHTML=p.html; document.body.appendChild(c);
    const sc=document.createElement("script"); sc.textContent=p.js; document.body.appendChild(sc);
    const g=document.getElementById("gate"); if(g) g.remove();
  }catch(e){ err.textContent="Password non corretta."; pw.value=""; pw.focus(); _sblocco=false; }
}
document.getElementById("pw").focus();
</script>
